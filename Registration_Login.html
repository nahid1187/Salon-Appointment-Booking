<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Salon System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div class="form-box active" id="loginBox">
<h2>Login</h2>

<form id="loginForm">

<input id="loginEmail" type="email" placeholder="Email" required>
<input id="loginPassword" type="password" placeholder="Password" required>

<div class="checkbox-group">
    <label>
        <input type="checkbox" id="showPasswordLogin">
        Show Password
    </label>

    <label>
        <input type="checkbox" id="rememberMe">
        Remember Me
    </label>
</div>

<button type="submit">Login</button>

<p id="forgotPasswordLink">Forgot Password?</p>

<p>Don't have account? <span id="showRegister">Register</span></p>

</form>
</div>

<!-- REGISTER -->
<div class="form-box" id="registerBox">
<h2>Register</h2>

<form id="registerForm">

<input id="name" type="text" placeholder="Full Name" required>
<input id="email" type="email" placeholder="Email" required>
<input id="password" type="password" placeholder="Password" required>

<div class="checkbox-group">
    <label>
        <input type="checkbox" id="showPasswordRegister">
        Show Password
    </label>
</div>

<select id="role">
<option value="customer">Customer</option>
<option value="salon">Salon Owner</option>
</select>

<button type="submit">Register</button>

<p>Already have account? <span id="showLogin">Login</span></p>

</form>
</div>

<!-- FORGOT PASSWORD -->
<div class="form-box" id="forgotBox">
<h2>Reset Password</h2>

<input id="resetEmail" type="email" placeholder="Enter your email">
<input id="newPassword" type="password" placeholder="New Password">

<button id="resetBtn">Reset Password</button>

<p><span id="backToLogin">Back to Login</span></p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
