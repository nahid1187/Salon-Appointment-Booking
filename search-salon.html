<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search Salon</title>
    <link rel="stylesheet" href="search-salon.css">
</head>
<body>

</div>

<script src="search-salon.js"></script>
</body>
</html>
